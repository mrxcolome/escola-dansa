# Fitxa de Google (API de Perfil d'Empresa): generador/gbp.py
#  - després de cada push a main (quan Vercel ja ha publicat la versió nova) i cada matí:
#    publica a la fitxa els posts nous del blog (els de data futura surten el seu dia)
#  - cada dia: actualitza la nota i el nombre d'opinions de la portada i, si canvien, ho publica
#  - a mà (pestanya Actions): prova | ressenyes | publica | llista | respon | fitxa | edita | fotos
# Secrets: GBP_CLIENT_ID, GBP_CLIENT_SECRET, GBP_REFRESH_TOKEN
name: fitxa de google

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # opinions de la portada
    - cron: "37 6 * * *"   # posts amb data d'avui
  workflow_dispatch:
    inputs:
      ordre:
        description: "què fer"
        type: choice
        options: [prova, ressenyes, publica, llista, respon, fitxa, edita, fotos]
        default: prova

concurrency:
  group: fitxa-google
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fitxa:
    runs-on: ubuntu-latest
    env:
      GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
      GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
      GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: baixar el codi
        uses: actions/checkout@v4
        with:
          ref: main

      - name: triar l'ordre
        id: ordre
        run: |
          case "${{ github.event_name }}" in
            push) echo "o=publica" >> "$GITHUB_OUTPUT" ;;
            schedule)
              if [ "${{ github.event.schedule }}" = "37 6 * * *" ]; then echo "o=publica"; else echo "o=ressenyes"; fi >> "$GITHUB_OUTPUT" ;;
            *) echo "o=${{ inputs.ordre }}" >> "$GITHUB_OUTPUT" ;;
          esac

      # Google baixa la foto del post de la web: abans de publicar, esperar que Vercel
      # serveixi aquesta versió (el sitemap publicat ha de ser igual que el del repo)
      - name: esperar que Vercel hagi publicat aquesta versió
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS https://escoladansa.com/sitemap.xml | cmp -s - sitemap.xml; then echo "publicada"; exit 0; fi
            sleep 10
          done
          echo "Vercel encara no serveix aquesta versió: no es publica res a la fitxa"; exit 1

      - name: executar
        run: python3 generador/gbp.py ${{ steps.ordre.outputs.o }}

      - name: regenerar la home ES i els markdown (si han canviat les opinions)
        if: steps.ordre.outputs.o == 'ressenyes'
        run: |
          if ! git diff --quiet; then
            cd generador && python3 genera_home_es.py && python3 genera_markdown.py
          fi

      - name: desar els canvis (Vercel desplega sol cada push)
        run: |
          git diff --quiet && { echo "sense canvis"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "${{ steps.ordre.outputs.o }}" = "ressenyes" ]; then
            git commit -m "portada: opinions de Google actualitzades automàticament"
          else
            git commit -m "fitxa: registre de posts, respostes i fotos publicats a Google"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
